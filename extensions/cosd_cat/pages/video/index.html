<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>octoDash Video Player</title>
    <style media="screen">
        html {
            font-size: 62.5%;
            --balena-display-scale: 1;
            --font-size: 18px;
        }

        @font-face {
            font-family: Gotham;
            font-style: normal;
            font-weight: 300;
            src: url("../fonts/GothamSSm-Light.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: Gotham;
            font-style: normal;
            font-weight: 400;
            src: url("../fonts/GothamSSm-Book.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: Gotham;
            font-style: normal;
            font-weight: 500;
            src: url("../fonts/GothamSSm-Medium.woff2") format("woff2");
            font-display: swap;
        }

        @font-face {
            font-family: Gotham;
            font-style: normal;
            font-weight: 800;
            src: url("../fonts/GothamSSm-Bold.woff2") format("woff2");
            font-display: swap;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: #180048;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            padding: 0;
            font-family: Gotham, helvetica, arial, sans-serif;
            font-size: 18px;
            font-size: 1.8rem;
            font-style: normal;
            font-weight: 300;
            line-height: 27px;
            line-height: 2.7rem;
            -moz-osx-font-smoothing: grayscale;
            -webkit-font-smoothing: antialiased;
            color: white;
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #180048;
            display: block;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #180048;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }

        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #180048;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #error-overlay.visible {
            display: flex;
        }

        .error-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 80%;
        }

        .image_area {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            width: 70%;
        }

        .text_area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            width: 80%;
        }

        h1 {
            font-size: 5em;
            font-weight: 700;
        }

        h3 {
            font-size: 1.5em;
            color: #60f0f8;
            font-weight: 500;
        }

        h4 {
            margin: 10px 0;
            line-height: 1.6em;
            font-size: 1.2em;
            font-weight: 300;
        }

        .dashboard_identifier {
            background-color: #60f0f8;
            color: #180048;
            border: #60f0f8;
            border-width: 1px;
            font-weight: 700;
            border-style: solid;
            display: inline-block;
            padding: 0.1em;
        }

        #error-details {
            background-color: black;
            color: white;
            font-family: monospace;
            padding: 10px;
        }

        #loading-image,
        #error-image {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="loading-overlay">
            <img id="loading-image" src="constantine-swim.webp" alt="Loading..." />
        </div>
        <div id="error-overlay">
            <div class="error-container">
                <div class="image_area">
                    <img id="error-image" src="../error/constantine_ouch.png" alt="Unable to display video" />
                </div>
                <div class="text_area">
                    <div class="header">
                        <h1>Oops!</h1>
                    </div>
                    <div class="sub_header">
                        <h3>This dashboard is having trouble connecting.</h3>
                    <h4>
                        Please get in touch over Slack in #techops-help and 
                        provide this dashboard identifier along with the error details below:
                    </h4>
                        <h4 class="dashboard_identifier" id="screenIdentifier"></h4>
                    </div>
                    <div>
                        <strong>Error details:</strong>
                        <p id="error-details"></p>
                    </div>
                </div>
            </div>
        </div>
        <video id="video" playsinline autoplay muted loop></video>
    </div>

    <script src="../../scripts/logger.js"></script>
    <script src="../../scripts/video-player.js"></script>
</body>
</html>
