<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>octoDash Video Player</title>
    <style media="screen">
        html {
            font-size: 62.5%;
            --balena-display-scale: 1;
            --font-size: 18px;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: #180048;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #180048;
            display: block;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #180048;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease-out;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-image {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="loading-overlay">
            <img id="loading-image" src="constantine-swim.webp" alt="Loading..." />
        </div>
        <video id="video" playsinline autoplay muted loop></video>
    </div>

    <script src="../../scripts/logger.js"></script>
    <script src="../../scripts/video-player.js"></script>
</body>
</html>
